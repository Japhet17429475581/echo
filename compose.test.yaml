name: echo-tests
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment: {POSTGRES_USER: echo, POSTGRES_PASSWORD: test_only, POSTGRES_DB: echo_test}
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U echo -d echo_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:1166a1ab81198ff768528df2c9e668c82206aae3ef4af2757efac386376fb79c
    networks: [test]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: echo-bot:test
    build: {context: ., target: test}
    environment:
      ECHO_DATABASE_URL: postgresql://echo:test_only@postgres/echo_test?sslmode=disable
      ECHO_TEST_DATABASE_URL: postgresql+asyncpg://echo:test_only@postgres/echo_test
      ECHO_TEST_REDIS_URL: redis://redis:6379/15
      ECHO_TEST_LIVE_ENGINES: "1"
    command: [python, scripts/integration.py]
    networks: [test]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
networks:
  test: {internal: true}
