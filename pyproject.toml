[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "echo-bot"
version = "1.0.0"
description = "Private Telegram interface for public username checks with Sherlock and Maigret"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram==3.31.0",
  "SQLAlchemy[asyncio]==2.1.8",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "redis==8.1.0",
  "httpx==0.28.1",
  "aiohttp==3.14.5",
  "pydantic-settings==2.16.2",
  "Jinja2==3.1.6",
  "reportlab==5.1.0",
  "tldextract==5.4.0",
  "beautifulsoup4==4.15.0",
  "psutil==7.2.2",
  "tzdata==2026.6",
  "dnspython==2.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4",
  "aiosqlite==0.22.1", "fakeredis[lua]==2.40.0", "pypdf==6.12.2",
]

[project.scripts]
echo-bot = "echo.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/echo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

